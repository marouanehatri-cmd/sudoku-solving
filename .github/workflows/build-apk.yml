name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Allow camera (needed for the Scan button)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Set app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}
            size=${d##*:}
            mkdir -p $RES/mipmap-$name
            convert icon.jpg -resize ${size}x${size} $RES/mipmap-$name/ic_launcher.png
            cp $RES/mipmap-$name/ic_launcher.png $RES/mipmap-$name/ic_launcher_round.png
            cp $RES/mipmap-$name/ic_launcher.png $RES/mipmap-$name/ic_launcher_foreground.png
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-solver-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
